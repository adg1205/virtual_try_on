<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="titan-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="titan-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#titan-shadow)">
    <!-- Bridge -->
    <path d="M 226 90 L 274 90" fill="none" stroke="url(#titan-metal)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left Rectangular Titanium Rim -->
    <rect x="90" y="68" width="136" height="78" rx="14" fill="none" stroke="url(#titan-metal)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Right Rectangular Titanium Rim -->
    <rect x="274" y="68" width="136" height="78" rx="14" fill="none" stroke="url(#titan-metal)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Hinge Barrels -->
    <path d="M 90 90 L 62 90" fill="none" stroke="url(#titan-metal)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 410 90 L 438 90" fill="none" stroke="url(#titan-metal)" stroke-width="5" stroke-linecap="round"/>

    <!-- Adjustable Clear Nose Pads -->
    <ellipse cx="234" cy="112" rx="3.5" ry="8" transform="rotate(16 234 112)" fill="#e2e8f0" fill-opacity="0.8" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="266" cy="112" rx="3.5" ry="8" transform="rotate(-16 266 112)" fill="#e2e8f0" fill-opacity="0.8" stroke="#64748b" stroke-width="1.5"/>
  </g>
</svg>
