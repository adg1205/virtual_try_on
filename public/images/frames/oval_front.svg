<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="oval-honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="oval-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#oval-shadow)" fill="none" stroke="url(#oval-honey)">
    <!-- Arched Keyhole Bridge -->
    <path d="M 224 96 Q 250 78 276 96" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Left Oval Rim -->
    <ellipse cx="152" cy="106" rx="66" ry="46" stroke-width="6.5"/>

    <!-- Right Oval Rim -->
    <ellipse cx="348" cy="106" rx="66" ry="46" stroke-width="6.5"/>

    <!-- Endpieces / Hinges -->
    <path d="M 86 106 L 58 106" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 414 106 L 442 106" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>