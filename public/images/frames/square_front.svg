<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="square-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="square-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#square-shadow)" fill="none" stroke="url(#square-crystal)" stroke-opacity="0.9">
    <!-- Keyhole Bridge -->
    <path d="M 224 88 Q 250 74 276 88" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Modern Square Acetate Rim -->
    <rect x="94" y="62" width="130" height="92" rx="18" stroke-width="7" stroke-linejoin="round"/>

    <!-- Right Modern Square Acetate Rim -->
    <rect x="276" y="62" width="130" height="92" rx="18" stroke-width="7" stroke-linejoin="round"/>

    <!-- Endpieces / Hinges -->
    <path d="M 94 88 L 62 88" stroke-width="6" stroke-linecap="round"/>
    <path d="M 406 88 L 438 88" stroke-width="6" stroke-linecap="round"/>

    <!-- Crystal Bevel Highlights -->
    <path d="M 104 72 L 214 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 286 72 L 396 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>